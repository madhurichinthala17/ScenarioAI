# Manually triggered workflow that:
#   1. Runs the ScenarioAI pipeline with your requirement
#   2. Commits the generated test files to a new branch
#   3. Opens a draft PR and adds you as reviewer
#
# How to trigger: GitHub → Actions tab → "Generate BDD Tests" → Run workflow

name: Generate BDD Tests

on:
  workflow_dispatch:
    inputs:
      requirement:
        description: "Natural language requirement (what the feature does)"
        required: true
        type: string
      reviewer:
        description: "GitHub username to add as PR reviewer (leave blank to skip)"
        required: false
        type: string
        default: "madhurichinthala17"

# These permissions allow the workflow to push branches and open PRs.
# Without them GITHUB_TOKEN is read-only and both operations would fail with 403.
permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      # Slugify the requirement into a valid branch name using Python (already installed).
      # Example: "Users can log in" → "scenarioai/users-can-log-in-20260617-143022"
      # We write to $GITHUB_OUTPUT so later steps can read it as steps.branch.outputs.name
      - name: Generate branch name
        id: branch
        run: |
          SLUG=$(python -c "
          import re, sys
          req = sys.argv[1]
          slug = re.sub(r'[^a-z0-9]+', '-', req.lower()).strip('-')[:40].rstrip('-')
          print(slug)
          " "${{ inputs.requirement }}")
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "name=scenarioai/${SLUG}-${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Create branch
        run: git checkout -b "${{ steps.branch.outputs.name }}"

      # Runs the ScenarioAI pipeline.
      # LLM env vars come from GitHub Secrets (Settings → Secrets → Actions).
      # OPENAI_API_KEY is never visible in logs — GitHub automatically masks secret values.
      # Exit code 1 from main.py means validation failed → this step fails →
      # the commit and PR steps are skipped automatically by GitHub Actions.
      - name: Run ScenarioAI pipeline
        env:
          LLM_PROVIDER: openai
          LLM_MODEL: gpt-4.1-nano
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python -m src.main --requirement "${{ inputs.requirement }}"

      # Safety check: if somehow no files changed, exit before creating an empty PR
      - name: Verify files were generated
        run: |
          if [ -z "$(git status --porcelain generated_tests/)" ]; then
            echo "ERROR: No files were generated in generated_tests/"
            exit 1
          fi
          echo "Generated files:"
          git status --short generated_tests/

      - name: Commit generated files
        run: |
          git config user.name "ScenarioAI Bot"
          git config user.email "scenarioai-bot@users.noreply.github.com"
          git add generated_tests/
          git commit -m "feat: generated BDD tests

          Requirement: ${{ inputs.requirement }}

          Generated by ScenarioAI pipeline
          Triggered by: @${{ github.actor }}"

      - name: Push branch
        run: git push origin "${{ steps.branch.outputs.name }}"

      # gh CLI is pre-installed on all GitHub-hosted runners and authenticated via GH_TOKEN.
      # --draft means the PR is created but cannot be merged until a human marks it ready.
      # We capture the PR URL so the next step can add the reviewer to the same PR.
      - name: Create draft PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "feat: BDD tests — $(echo "${{ inputs.requirement }}" | cut -c1-60)" \
            --body "## Generated BDD Tests

          **Requirement:**
          > ${{ inputs.requirement }}

          **Triggered by:** @${{ github.actor }}

          ---

          ### Review checklist
          - [ ] Feature file scenarios match the requirement
          - [ ] Locators look correct (if no \`app_url\` was provided, update them to match your real UI)
          - [ ] Step definitions are complete
          - [ ] Page Object Model methods are correct

          > **Note:** This is a draft PR — review and edit the generated files, then mark ready to merge." \
            --draft \
            --head "${{ steps.branch.outputs.name }}")

          echo "Generated PR: $PR_URL"
          # Write PR URL to output so the reviewer step can reference it
          echo "url=$PR_URL" >> $GITHUB_OUTPUT

      # Only runs if a reviewer was specified in the workflow inputs
      - name: Add reviewer
        if: inputs.reviewer != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ steps.pr.outputs.url }}" \
            --add-reviewer "${{ inputs.reviewer }}"
