# Generates a BDD test suite and opens a draft PR. Two ways to trigger:
#
#   1. Automatically — open (or label) an Issue with the `scenarioai` label.
#      The issue body becomes the requirement; the issue author becomes the
#      reviewer; the resulting PR is linked back to the issue.
#
#   2. Manually — Actions tab → "Generate BDD Tests" → Run workflow.
#
# NOTE: create a label named `scenarioai` in the repo (Issues → Labels) first,
# otherwise the auto-trigger condition can never match.

name: Generate BDD Tests

on:
  workflow_dispatch:
    inputs:
      requirement:
        description: "Natural language requirement (what the feature does)"
        required: true
        type: string
      reviewer:
        description: "GitHub username to add as PR reviewer (leave blank to skip)"
        required: false
        type: string
        default: "madhurichinthala17"
  issues:
    # Only `labeled` — GitHub fires a `labeled` event whether the label is added
    # at issue creation OR later, so this covers both cases with exactly ONE run.
    # (Adding `opened` too would double-fire when an issue is created with the
    # label already applied, producing two branches and two PRs.)
    types: [labeled]

# Allow the workflow to push branches, open PRs, and comment back on the issue.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest

    # Manual runs always proceed. Issue-triggered runs only proceed when the
    # `scenarioai` label is present — so random bug reports or questions don't
    # spawn an LLM run and a PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'scenarioai')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Resolve inputs
        id: input
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REQ: ${{ github.event.inputs.requirement }}
          DISPATCH_REVIEWER: ${{ github.event.inputs.reviewer }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REQ="$DISPATCH_REQ"
            REVIEWER="$DISPATCH_REVIEWER"
          else
            REQ="$ISSUE_BODY"
            REVIEWER="$ISSUE_AUTHOR"
          fi

          if [ -z "$(printf '%s' "$REQ" | tr -d '[:space:]')" ]; then
            echo "ERROR: requirement (issue body / input) is empty"
            exit 1
          fi

          {
            echo "requirement<<SCENARIOAI_EOF"
            printf '%s\n' "$REQ"
            echo "SCENARIOAI_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "reviewer=$REVIEWER" >> "$GITHUB_OUTPUT"

      - name: Generate branch name
        id: branch
        env:
          REQUIREMENT: ${{ steps.input.outputs.requirement }}
        run: |
          SLUG=$(python -c "
          import os, re
          req = os.environ['REQUIREMENT']
          slug = re.sub(r'[^a-z0-9]+', '-', req.lower()).strip('-')[:40].rstrip('-')
          print(slug or 'requirement')
          ")
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "name=scenarioai/${SLUG}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Create branch
        run: git checkout -b "${{ steps.branch.outputs.name }}"

      - name: Run ScenarioAI pipeline
        env:
          LLM_PROVIDER: openai
          LLM_MODEL: gpt-4.1-nano
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REQUIREMENT: ${{ steps.input.outputs.requirement }}
        run: uv run python -m src.main --requirement "$REQUIREMENT"

      # Safety check: if somehow no files changed, exit before creating an empty PR
      - name: Verify files were generated
        run: |
          if [ -z "$(git status --porcelain generated_tests/)" ]; then
            echo "ERROR: No files were generated in generated_tests/"
            exit 1
          fi
          echo "Generated files:"
          git status --short generated_tests/

      - name: Commit generated files
        env:
          REQUIREMENT: ${{ steps.input.outputs.requirement }}
          ACTOR: ${{ github.actor }}
        run: |
          git config user.name "ScenarioAI Bot"
          git config user.email "scenarioai-bot@users.noreply.github.com"
          git add generated_tests/
          git commit -m "feat: generated BDD tests" \
                     -m "Requirement: $REQUIREMENT" \
                     -m "Generated by ScenarioAI pipeline" \
                     -m "Triggered by: @$ACTOR"

      - name: Push branch
        run: git push origin "${{ steps.branch.outputs.name }}"


      - name: Create draft PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIREMENT: ${{ steps.input.outputs.requirement }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          HEAD_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          TITLE="feat: BDD tests — $(printf '%s' "$REQUIREMENT" | head -n1 | cut -c1-60)"

          BODY="## Generated BDD Tests

          **Requirement:**
          > $REQUIREMENT

          **Triggered by:** @$ACTOR"

          # If an issue triggered this, link it so merging the PR closes the issue.
          if [ -n "$ISSUE_NUMBER" ]; then
            BODY="$BODY

          Closes #$ISSUE_NUMBER"
          fi

          BODY="$BODY

          ---

          ### Review checklist
          - [ ] Feature file scenarios match the requirement
          - [ ] Locators look correct (if no \`app_url\` was provided, update them to match your real UI)
          - [ ] Step definitions are complete
          - [ ] Page Object Model methods are correct

          > **Note:** This is a draft PR — review and edit the generated files, then mark ready to merge."

          PR_URL=$(gh pr create --title "$TITLE" --body "$BODY" --draft --head "$HEAD_BRANCH")
          echo "Generated PR: $PR_URL"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Add reviewer
        if: steps.input.outputs.reviewer != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWER: ${{ steps.input.outputs.reviewer }}
        run: gh pr edit "${{ steps.pr.outputs.url }}" --add-reviewer "$REVIEWER"


      - name: Comment PR link on issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "🤖 **ScenarioAI** generated a draft PR for this issue: $PR_URL"
