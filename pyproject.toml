[project]
name = "scenarioai"
version = "0.1.0"
description = "AI-powered BDD test suite generator"
requires-python = ">=3.12"

dependencies = [
    "langgraph>=1.2.4",
    "langchain>=1.3.4",
    "langsmith>=0.8.9",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "ollama>=0.4.0",
    "behave>=1.2.6",
    "playwright>=1.40.0",
    # Runtime dependency: ValidatorAgent shells out to `ruff` to lint generated
    # code, so it must be present in the pipeline (uv sync), not just in CI.
    "ruff>=0.6.0",
]

# Dev/test tooling lives in a PEP 735 dependency group (not optional-dependencies,
# which is for user-facing extras). `uv sync --dev` installs this group; ruff is a
# main dependency because the pipeline lints generated code with it at runtime.
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
